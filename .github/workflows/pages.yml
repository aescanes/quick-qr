# Publishes the web build to GitHub Pages when a version tag (v*) is pushed, e.g. v0.1.0.
# The deploy only runs if the tests pass.
name: Pages
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run, from the main branch only (see environment rule above)

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a running deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

  deploy:
    needs: test # skipped if the tests fail
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v5
