# Builds desktop installers for macOS (Apple Silicon + Intel), Windows and Linux
# and attaches them to a draft GitHub release. Installers are only ever built after the tests pass.
#
# Policy: desktop releases come from version tags (v*) only, never from commits to main.
#
# DISABLED for now: the desktop release is paused while the UI and web version are built.
# It only runs when started by hand from the Actions tab. To re-enable the tag-triggered release,
# replace `workflow_dispatch:` below with:
#   push:
#     tags: ["v*"]
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never run two releases at once; let a running one finish instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

  # The release body is the matching CHANGELOG.md section; fails if it is missing or empty.
  notes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref_name }}" }
      - id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "${{ inputs.tag || github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: [test, notes] # no installers are built if the tests fail
    permissions:
      contents: write
      id-token: write # sign the build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: "--target aarch64-apple-darwin" }
          - { platform: macos-latest, args: "--target x86_64-apple-darwin" }
          - { platform: ubuntu-22.04, args: "" }
          - { platform: windows-latest, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref_name }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "QuickQR ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # artifactPaths is a JSON array; the attest action wants one path per line.
      - name: List installers
        id: installers
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e 'const l = JSON.parse(process.env.ARTIFACT_PATHS).join("\n"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "paths<<EOF\n" + l + "\nEOF\n")'
      # Verify with: gh attestation verify <installer> --repo aescanes/quick-qr
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.installers.outputs.paths }}
