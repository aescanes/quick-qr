# Builds desktop installers for macOS (Apple Silicon + Intel), Windows and Linux
# and attaches them to a draft GitHub release. Installers are only ever built after the tests pass.
#
# Policy: desktop releases come from version tags (v*) only, never from commits to main.
#
# DISABLED for now: the desktop release is paused while the UI and web version are built.
# It only runs when started by hand from the Actions tab. To re-enable the tag-triggered release,
# replace `workflow_dispatch:` below with:
#   push:
#     tags: ["v*"]
name: Release
on:
  workflow_dispatch:

# Never run two releases at once; let a running one finish instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  desktop:
    needs: test # no installers are built if the tests fail
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: "--target aarch64-apple-darwin" }
          - { platform: macos-latest, args: "--target x86_64-apple-darwin" }
          - { platform: ubuntu-22.04, args: "" }
          - { platform: windows-latest, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickQR ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
