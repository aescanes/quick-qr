[package]
name = "QuickQR"
version = "0.4.0"
description = "Styled QR codes from text or URLs"
license = "MIT"
edition = "2021"

[lib]
name = "quick_qr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
